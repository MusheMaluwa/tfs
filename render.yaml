# Render Blueprint — see DEPLOYMENT.md for the full guide.
#
# Deploys the backend (Node web service), a managed PostgreSQL, and the
# React frontends (static site). Not fully hands-off: after the first
# deploy you still need to paste the backend's live URL into the
# frontend (DEPLOYMENT.md step 5) — Render assigns that URL only once
# the backend service exists, so it can't be known ahead of time here.

databases:
  - name: tfs-logistics-db
    databaseName: tfs_logistics
    user: tfs
    plan: free

services:
  - type: web
    name: tfs-logistics-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: "npm ci --omit=dev"
    # seed is safe to re-run: sites and assets insert ON CONFLICT DO
    # NOTHING, so a redeploy tops up the demo data rather than
    # duplicating or wiping it. Drop it once real data is in.
    startCommand: "npm run seed && npm start"
    healthCheckPath: /api/health
    envVars:
      - key: AUTH_SECRET
        generateValue: true
      # The managed database above. With this set the API uses
      # node-postgres; without it, it would look for the embedded engine
      # that `--omit=dev` deliberately leaves out of the build.
      - key: DATABASE_URL
        fromDatabase:
          name: tfs-logistics-db
          property: connectionString

  - type: web
    name: tfs-logistics-scanner
    runtime: static
    rootDir: frontend-react
    staticPublishPath: .
    buildCommand: "echo 'no build needed — static files'"
