# NOTE: written for this repository's actual GitHub Actions setup but
# not executed here (no CI runner available in the environment this was
# produced in) — the syntax follows standard GitHub Actions structure;
# confirm on first push before trusting it fully.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    # A real PostgreSQL, so CI proves the thing that actually ships and
    # not only the embedded engine the default suite uses.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tfs
          POSTGRES_PASSWORD: tfs
          POSTGRES_DB: tfs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tfs -d tfs_test"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: backend
        run: npm ci

      - name: Test against the embedded PostgreSQL
        working-directory: backend
        run: npm test

      - name: Test against a real PostgreSQL server
        working-directory: backend
        env:
          DATABASE_URL: postgres://tfs:tfs@localhost:5432/tfs_test
        # Sequential: both suites reset the same tables, and here they
        # share one server rather than getting a database each.
        run: npm run test:pg

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: frontend-react
        run: npm ci
      - name: Verify components, logic and app separation
        working-directory: frontend-react
        run: npm run verify

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tfs
          POSTGRES_PASSWORD: tfs
          POSTGRES_DB: tfs_logistics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tfs -d tfs_logistics"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://tfs:tfs@localhost:5432/tfs_logistics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend
        working-directory: backend
        run: npm ci
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end suite against a local server
        run: |
          cd backend && npm run seed && node src/server.js &
          # The API applies the schema before it listens, so poll the
          # health endpoint instead of guessing at a sleep.
          npx --yes wait-on http://localhost:4000/api/health
          cd e2e && npx playwright test
