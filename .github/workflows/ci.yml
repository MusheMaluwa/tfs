# NOTE: written for this repository's actual GitHub Actions setup but
# not executed here (no CI runner available in the environment this was
# produced in) — the syntax follows standard GitHub Actions structure;
# confirm on first push before trusting it fully.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: backend
        run: npm ci

      # `npm test` starts its own mongod (mongodb-memory-server) as a
      # single-node replica set, so there is no `services:` block here
      # and no container to wait on. That is the same engine the
      # deployment runs; what it does not prove is that the code works
      # against a server reached over the network, which is what the
      # step below is for.
      - name: Test against the in-process MongoDB
        working-directory: backend
        run: npm test

      # A real mongod over TCP. Started by hand rather than through
      # `services:` because it needs `--replSet` plus an rs.initiate()
      # afterwards, and a service container gives nowhere to run that.
      - name: Start a real MongoDB with a replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval \
              "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]})" && break
            sleep 2
          done
          # initiate() returns before the node has actually become
          # primary; transactions fail until it has.
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval \
              "db.hello().isWritablePrimary" | grep -q true && break
            sleep 2
          done

      - name: Test against that server
        working-directory: backend
        env:
          MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
          # Must end in _test — the suites delete every document, and
          # src/__tests__/helpers/reset.js refuses anything else.
          MONGODB_DB: tfs_test
        # Sequential: both suites empty the same collections, and here
        # they share one server rather than getting one each.
        run: npm run test:atlas

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: frontend-react
        run: npm ci
      - name: Verify components, logic and app separation
        working-directory: frontend-react
        run: npm run verify

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend
        working-directory: backend
        run: npm ci
      - name: Start a real MongoDB with a replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval \
              "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]})" && break
            sleep 2
          done
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval \
              "db.hello().isWritablePrimary" | grep -q true && break
            sleep 2
          done
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end suite against a local server
        env:
          MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
          MONGODB_DB: tfs_e2e_test
        run: |
          cd backend && npm run seed && node src/server.js &
          # The API applies the schema before it listens, so poll the
          # health endpoint instead of guessing at a sleep.
          npx --yes wait-on http://localhost:4000/api/health
          cd e2e && npx playwright test
