<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TFS Logistics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
<style>
  :root{
    --bg:#F4F7FB; --panel:#FFFFFF; --panel-2:#EEF3FA; --panel-3:#E1EAF6;
    --line:rgba(10,40,80,0.08); --line-strong:rgba(10,40,80,0.18);
    --amber:#0B63CE; --amber-dim:rgba(11,99,206,0.15);
    --cyan:#2AA8E0; --cyan-dim:rgba(42,168,224,0.15);
    --green:#1E9E63; --green-dim:rgba(30,158,99,0.15);
    --red:#D93025; --red-dim:rgba(217,48,37,0.15);
    --violet:#6C5CE7; --violet-dim:rgba(108,92,231,0.15);
    --text:#101A2B; --text-dim:#5B6B82; --text-dimmer:#93A0B2;
    --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:var(--font-body); min-height:100vh; -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:1100px; margin:0 auto; padding:20px 18px 70px; }
  header.top{ display:flex; align-items:center; justify-content:space-between; padding-bottom:14px; margin-bottom:16px; border-bottom:1px solid var(--line); flex-wrap:wrap; gap:10px; }
  .brand{ display:flex; align-items:center; gap:11px; }
  .brand .mark{ width:auto; min-width:42px; height:32px; padding:0 8px; border-radius:6px; background:linear-gradient(135deg,var(--amber),var(--cyan)); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; color:#FFFFFF; font-size:12px; letter-spacing:0.5px; }
  .brand h1{ font-family:var(--font-display); font-size:19px; margin:0; letter-spacing:0.3px; }
  .brand .sub{ font-family:var(--font-mono); font-size:9.5px; color:var(--text-dim); letter-spacing:1.3px; text-transform:uppercase; margin-top:1px; }

  nav.tabs{ display:flex; gap:2px; margin-bottom:18px; border-bottom:1px solid var(--line); overflow-x:auto; }
  nav.tabs button{ background:transparent; border:none; color:var(--text-dim); font-family:var(--font-display); font-size:13.5px; padding:10px 4px; margin-right:18px; cursor:pointer; position:relative; white-space:nowrap; }
  nav.tabs button.active{ color:var(--text); }
  nav.tabs button.active::after{ content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--amber); }
  nav.tabs button:hover{ color:var(--text); }

  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:20px; }
  .panel + .panel{ margin-top:14px; }
  .panel h2{ font-family:var(--font-display); font-size:16px; margin:0 0 4px; }
  .panel h3{ font-family:var(--font-display); font-size:13.5px; margin:16px 0 8px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.3px; }
  .panel .desc{ font-family:var(--font-body); font-size:12.5px; color:var(--text-dim); margin-bottom:14px; }

  .btn{ font-family:var(--font-display); font-size:13px; letter-spacing:0.2px; border-radius:7px; border:1px solid var(--line-strong); background:var(--panel-2); color:var(--text); padding:10px 15px; cursor:pointer; }
  .btn:hover{ border-color:var(--text-dim); }
  .btn.primary{ background:var(--amber); color:#FFFFFF; border-color:var(--amber); font-weight:600; }
  .btn.primary:hover{ filter:brightness(1.08); }
  .btn.sm{ padding:6px 10px; font-size:11.5px; }
  input, select{ font-family:var(--font-body); font-size:13.5px; padding:9px 11px; border-radius:7px; border:1px solid var(--line-strong); background:var(--panel-2); color:var(--text); }
  input:focus, select:focus{ outline:none; border-color:var(--cyan); }

  .chip{ display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:10.5px; letter-spacing:0.6px; text-transform:uppercase; padding:5px 10px; border-radius:20px; border:1px solid transparent; white-space:nowrap; }
  .chip .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }
  .chip.c-idle{ background:rgba(10,37,64,0.05); color:var(--text-dim); border-color:var(--line-strong); }
  .chip.c-active{ background:var(--amber-dim); color:var(--amber); border-color:rgba(11,99,206,0.4); }
  .chip.c-transit{ background:var(--cyan-dim); color:var(--cyan); border-color:rgba(42,168,224,0.4); }
  .chip.c-hub{ background:var(--violet-dim); color:var(--violet); border-color:rgba(108,92,231,0.4); }
  .chip.c-return{ background:var(--green-dim); color:var(--green); border-color:rgba(30,158,99,0.4); }
  .chip.c-outstanding{ background:var(--red-dim); color:var(--red); border-color:rgba(217,48,37,0.4); }
  .chip.c-damaged{ background:var(--red-dim); color:var(--red); border-color:rgba(217,48,37,0.4); }
  .chip.c-branch{ background:var(--violet-dim); color:var(--violet); border-color:rgba(108,92,231,0.4); }

  table.ref{ width:100%; border-collapse:collapse; }
  table.ref th{ text-align:left; font-family:var(--font-mono); font-size:9.5px; letter-spacing:0.8px; text-transform:uppercase; color:var(--text-dim); padding:8px 9px; border-bottom:1px solid var(--line-strong); }
  table.ref td{ padding:10px 9px; border-bottom:1px solid var(--line); font-size:12.5px; vertical-align:top; }

  table.reg{ width:100%; border-collapse:collapse; }
  table.reg th{ text-align:left; font-family:var(--font-mono); font-size:9.5px; letter-spacing:0.8px; text-transform:uppercase; color:var(--text-dim); padding:8px 9px; border-bottom:1px solid var(--line-strong); }
  table.reg td{ padding:9px; border-bottom:1px solid var(--line); font-size:12.5px; }
  .filters{ display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }

  .kpi-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:16px; }
  @media (max-width:760px){ .kpi-grid{ grid-template-columns:repeat(2,1fr); } }
  .kpi{ background:var(--panel-2); border:1px solid var(--line-strong); border-radius:8px; padding:13px 14px; }
  .kpi .kv{ font-family:var(--font-display); font-size:26px; }
  .kpi .kl{ font-family:var(--font-mono); font-size:9.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.6px; margin-top:2px; }
  .kpi .kt{ font-family:var(--font-mono); font-size:9px; color:var(--text-dimmer); margin-top:4px; }

  .status-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(100px,1fr)); gap:8px; margin-bottom:16px; }
  .status-cell{ background:var(--panel-2); border:1px solid var(--line-strong); border-radius:8px; padding:11px; text-align:center; cursor:pointer; font-family:inherit; }
  .status-cell:hover{ border-color:var(--amber); }
  .status-cell.active{ border-color:var(--amber); background:var(--amber-dim); }
  .status-cell .sv{ font-family:var(--font-display); font-size:22px; }
  .status-cell .sl{ font-family:var(--font-mono); font-size:8.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.4px; margin-top:2px; }

  table.reg tbody tr{ cursor:pointer; }
  table.reg tbody tr:hover{ background:var(--panel-2); }

  .modal-overlay{ position:fixed; inset:0; background:rgba(6,10,18,0.45); z-index:1000; display:none; align-items:center; justify-content:center; padding:20px; }
  .modal-overlay.open{ display:flex; }
  .modal-box{ background:var(--panel); border:1px solid var(--line-strong); border-radius:12px; width:100%; max-width:540px; max-height:82vh; overflow-y:auto; padding:22px; box-shadow:0 24px 60px rgba(10,40,80,0.18); }
  .modal-box .mb-close{ float:right; background:transparent; border:none; color:var(--text-dim); font-size:20px; cursor:pointer; line-height:1; padding:0 2px; }
  .modal-box .mb-close:hover{ color:var(--text); }
  .modal-box h2{ font-family:var(--font-display); font-size:20px; margin:0 0 4px; }
  .modal-box .mb-sub{ font-family:var(--font-mono); font-size:11px; color:var(--text-dim); margin-bottom:14px; }
  .detail-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:16px; }
  .detail-item{ background:var(--panel-2); border:1px solid var(--line-strong); border-radius:8px; padding:10px 12px; }
  .detail-item .k{ font-family:var(--font-mono); font-size:9px; color:var(--text-dimmer); text-transform:uppercase; letter-spacing:0.6px; }
  .detail-item .v{ font-family:var(--font-mono); font-size:13px; color:var(--text); margin-top:2px; }
  .timeline .ev{ display:grid; grid-template-columns:96px auto 1fr; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); align-items:start; }
  .timeline .ev:last-child{ border-bottom:none; }
  .timeline .ev .ts{ font-family:var(--font-mono); font-size:10.5px; color:var(--text-dimmer); padding-top:2px; }
  .timeline .ev .dotcol{ display:flex; justify-content:center; }
  .timeline .ev .dotcol span{ width:7px; height:7px; border-radius:50%; margin-top:6px; background:var(--amber); display:block; }
  .timeline .ev .body{ font-size:12.5px; color:var(--text); }
  .timeline .ev .body .op{ font-family:var(--font-mono); font-size:10px; color:var(--text-dim); margin-top:2px; }

  .map-wrap{ background:var(--panel-2); border:1px solid var(--line-strong); border-radius:8px; padding:14px; margin-bottom:16px; }
  .map-wrap svg{ width:100%; height:auto; display:block; }
  #leafletMap{ width:100%; height:420px; border-radius:6px; z-index:1; }
  .leaflet-popup-content{ font-family:var(--font-body); font-size:12.5px; }
  .leaflet-popup-content b{ font-family:var(--font-display); }
  .map-legend{ display:flex; gap:14px; margin-top:8px; font-family:var(--font-mono); font-size:10px; color:var(--text-dim); flex-wrap:wrap; }
  .map-legend span{ display:inline-flex; align-items:center; gap:5px; }
  .map-legend i{ width:8px; height:8px; border-radius:50%; display:inline-block; }

  .export-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
  .exception-row{ display:grid; grid-template-columns:90px 1fr auto; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); align-items:center; font-size:12px; }
  .exception-row .ex-ts{ font-family:var(--font-mono); font-size:10px; color:var(--text-dimmer); }
  .exception-row .ex-type{ font-family:var(--font-mono); font-size:9px; color:var(--red); text-transform:uppercase; letter-spacing:0.6px; }

  .refresh-note{ font-family:var(--font-mono); font-size:10px; color:var(--text-dimmer); display:flex; align-items:center; gap:6px; }
  .pulse{ width:6px; height:6px; border-radius:50%; background:var(--green); animation:pulse 2s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.3;} }

  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--panel-2); border:1px solid var(--green); color:var(--green); font-family:var(--font-mono); font-size:12px; padding:10px 18px; border-radius:8px; z-index:999; box-shadow:0 10px 26px rgba(0,0,0,0.4); opacity:0; pointer-events:none; transition:opacity .2s,transform .2s; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }
  .toast.err{ border-color:var(--red); color:var(--red); }
  footer{ text-align:center; margin-top:30px; font-family:var(--font-mono); font-size:9.5px; letter-spacing:1px; color:var(--text-dimmer); }
  .empty-note{ font-family:var(--font-mono); font-size:11.5px; color:var(--text-dimmer); padding:8px 0; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<div class="modal-overlay" id="assetModal">
  <div class="modal-box" id="assetModalBox"></div>
</div>

<div id="scanOverlay" style="position:fixed;inset:0;background:rgba(6,10,18,0.92);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;">
  <div style="background:var(--panel);border:1px solid var(--line-strong);border-radius:10px;width:100%;max-width:440px;padding:16px;">
    <h3 style="font-family:var(--font-display);font-size:18px;margin:0 0 4px;">Scan barcode</h3>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim);margin-bottom:10px;">Point the camera at the asset barcode.</div>
    <div style="position:relative;width:100%;aspect-ratio:4/3;background:#000;border-radius:6px;overflow:hidden;border:1px solid var(--line-strong);">
      <video id="scanVideo" muted playsinline style="width:100%;height:100%;object-fit:cover;display:block;"></video>
    </div>
    <div id="scanStatus" style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim);margin-top:10px;min-height:16px;"></div>
    <div style="display:flex;justify-content:flex-end;margin-top:10px;"><button class="btn sm" id="scanCancel">Cancel</button></div>
  </div>
</div>

function nowTs(){ return Date.now(); }
function fmtTs(ts){ return ts ? new Date(ts).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '—'; }
function daysSince(ts){ return Math.floor((nowTs()-ts)/86400000); }
function escapeHtml(str){ return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function uidManifest(prefix){ return prefix + '-' + String(Math.floor(100000+Math.random()*899999)); }

/* ---------------- seed data (identical to the Scan app) ---------------- */
function seedState(){
  const t0 = nowTs();
  const assets = [];
  let n = 1;
  function addAsset(type, dc, status, stage, extra){
    const id = 'RT-' + String(100000+n).padStart(6,'0'); n++;
    assets.push(Object.assign({
      id, type, homeDC: dc, status, stage, outstanding:null,
      manifestId:null, manifestKind:null, hubArrivalAt:null, custodyLog:[], transferTo:null,
      registeredAt: t0 - 86400000*(30+Math.floor(Math.random()*300)),
    }, extra||{}));
    return assets[assets.length-1];
  }
  for(let i=0;i<10;i++) addAsset(i%2?'Rolltainer':'Hyper Cage', DC_SITES[i%DC_SITES.length], 'Available at DC', 0);

  const manifests = [];
  const exceptions = [];

  const doneAssets = [addAsset('Rolltainer', DC_SITES[0], 'Available at DC', 0), addAsset('Hyper Cage', DC_SITES[0], 'Available at DC', 0)];
  const doneManifest = { id: uidManifest('MAN'), kind:'dispatch', originDC: DC_SITES[0], destinationHub: HUB_SITES[33], // Bloemfontein
    createdAt: t0 - 86400000*4, expected: doneAssets.map(a=>a.id), scanned:{}, unexpected:[], stage:5,
    log:[], completedDispatch:true, returnManifestId:null };
  manifests.push(doneManifest);
  doneAssets.forEach(a=>{ a.custodyLog.push({note:'Full cycle completed (seed)', ts: t0 - 86400000*1}); });

  const midAssets = [addAsset('Rolltainer', DC_SITES[0], 'Dispatched — In Transit', 2), addAsset('Rolltainer', DC_SITES[0], 'Dispatched — In Transit', 2), addAsset('Hyper Cage', DC_SITES[0], 'Dispatched — In Transit', 2)];
  const midManifest = { id: uidManifest('MAN'), kind:'dispatch', originDC: DC_SITES[0], destinationHub: HUB_SITES[51], // Bryanston
    createdAt: t0 - 3600000*6, expected: midAssets.map(a=>a.id), scanned:{}, unexpected:[], stage:2, log:[], completedDispatch:false, returnManifestId:null };
  midAssets.forEach(a=>{ a.manifestId = midManifest.id; a.manifestKind='dispatch'; });
  manifests.push(midManifest);

  const hubAssets = [addAsset('Rolltainer', DC_SITES[1], 'At Hub: ' + HUB_SITES[153] /* George */, 5, { hubArrivalAt: t0 - 86400000*9 })];
  const hubManifest = { id: uidManifest('MAN'), kind:'dispatch', originDC: DC_SITES[1], destinationHub: HUB_SITES[153], // George
    createdAt: t0 - 86400000*10, expected: hubAssets.map(a=>a.id), scanned:{}, unexpected:[], stage:5, log:[], completedDispatch:true, returnManifestId:null };
  hubAssets.forEach(a=>{ a.manifestId = hubManifest.id; a.manifestKind='dispatch'; });
  manifests.push(hubManifest);

  const missingAsset = addAsset('Hyper Cage', DC_SITES[2], 'Available at DC', 0);
  missingAsset.outstanding = { reason:'Missed scan at Hub Intake (seed)', since: t0 - 86400000*2 };
  exceptions.push({ ts: t0 - 86400000*2, type:'Missed Scan', assetId: missingAsset.id, note:'Expected at Hub Intake but not scanned within timeout.' });

  // one of each non-linear state, so the dashboard and registry show them immediately
  const damaged = addAsset('Hyper Cage', DC_SITES[0], 'Damaged / Written Off', 0);
  damaged.custodyLog.push({ note:'Damaged Asset Scan-Out — cracked frame (seed)', ts: t0 - 86400000*3 });
  const maint = addAsset('Rolltainer', DC_SITES[1], 'In Maintenance', 0);
  maint.custodyLog.push({ note:'Maintenance Scan-Out — wheel replacement (seed)', ts: t0 - 86400000*1 });
  const gls = addAsset('Rolltainer', DC_SITES[0], 'With GLS Vendor: ' + GLS_SITES[0], 0);
  gls.custodyLog.push({ note:'GLS Vendor Custody — transferred (seed)', ts: t0 - 86400000*5 });
  const transfer = addAsset('Hyper Cage', DC_SITES[2], 'Inter-DC Transfer to ' + DC_SITES[0], 0, { transferTo: DC_SITES[0] });
  transfer.custodyLog.push({ note:'Inter-DC Transfer — scanned out (seed)', ts: t0 - 3600000*10 });

  return { assets, manifests, exceptions, taggedFleet: 154, totalFleet: 200, session:null };
}
function loadState(){ try{ const raw = localStorage.getItem(STORE_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; } }
function saveState(){ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }

let S = loadState() || seedState();
if(!S.dcSites) S.dcSites = DC_SITES.slice();
if(!S.hubSites) S.hubSites = HUB_SITES.slice();
if(!S.returnsFacilities) S.returnsFacilities = RETURNS_SITES.slice();
DC_SITES.length = 0; DC_SITES.push(...S.dcSites);
HUB_SITES.length = 0; HUB_SITES.push(...S.hubSites);
RETURNS_SITES.length = 0; RETURNS_SITES.push(...S.returnsFacilities);
saveState();

function siteArrayFor(kind){ return kind==='dc' ? S.dcSites : kind==='hub' ? S.hubSites : S.returnsFacilities; }
function syncSiteArrays(){
  DC_SITES.length = 0; DC_SITES.push(...S.dcSites);
  HUB_SITES.length = 0; HUB_SITES.push(...S.hubSites);
  RETURNS_SITES.length = 0; RETURNS_SITES.push(...S.returnsFacilities);
}
function addSite(kind, rawName){
  const name = rawName.trim();
  if(!name) return { ok:false, msg:'Enter a name.' };
  const arr = siteArrayFor(kind);
  if(arr.some(s=>s.toLowerCase()===name.toLowerCase())) return { ok:false, msg:'That site already exists.' };
  arr.push(name);
  syncSiteArrays();
  saveState();
  return { ok:true };
}
function siteInUse(name){
  return S.assets.some(a=>a.homeDC===name || a.status===('At Hub: '+name) || a.transferTo===name) ||
    S.manifests.some(m=> m.originDC===name || m.destinationHub===name || m.originHub===name || m.destinationDC===name);
}
function removeSite(kind, name){
  if(siteInUse(name)) return { ok:false, msg:'In use by assets or manifests — can\'t remove.' };
  const arr = siteArrayFor(kind);
  const idx = arr.indexOf(name);
  if(idx===-1) return { ok:false, msg:'Not found.' };
  arr.splice(idx,1);
  syncSiteArrays();
  saveState();
  return { ok:true };
}

let activeTab = 'dashboard';

function findAsset(id){ return S.assets.find(a=>a.id.toLowerCase()===String(id).trim().toLowerCase()); }
function findManifest(id){ return S.manifests.find(m=>m.id===id); }
function statusChipClass(status){
  if(status.startsWith('Available')) return 'c-idle';
  if(status.startsWith('In Dispatch')) return 'c-active';
  if(status.includes('In Transit')) return 'c-transit';
  if(status.startsWith('At Hub')) return 'c-hub';
  if(status.startsWith('At WSW')) return 'c-branch';
  if(status.startsWith('Ready for Return')) return 'c-return';
  if(status === 'Damaged / Written Off') return 'c-damaged';
  if(status === 'In Maintenance' || status.startsWith('With GLS Vendor') || status.startsWith('Inter-DC Transfer')) return 'c-branch';
  return 'c-idle';
}
function rollupStatus(asset){
  if(asset.outstanding) return 'Outstanding';
  if(asset.status.startsWith('Available')) return 'Available';
  if(asset.status.startsWith('In Dispatch')) return 'In Dispatch';
  if(asset.status.includes('In Transit')) return 'In Transit';
  if(asset.status.startsWith('At Hub')) return 'At Hub';
  if(asset.status.startsWith('At WSW')) return 'At WSW';
  if(asset.status.startsWith('Ready for Return')) return 'Ready for Return';
  if(asset.status === 'Damaged / Written Off') return 'Damaged';
  if(asset.status === 'In Maintenance') return 'Maintenance';
  if(asset.status.startsWith('With GLS Vendor')) return 'GLS Custody';
  if(asset.status.startsWith('Inter-DC Transfer')) return 'Inter-DC Transfer';
  return 'Available';
}
function showToast(msg, isErr){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show' + (isErr?' err':'');
  setTimeout(()=> t.className='toast', 2000);
}

    </div>`;
  }).join('') || `<div class="empty-note">None yet.</div>`;
}
function bindRegistry(){
  document.getElementById('regBtn').addEventListener('click', ()=>{
    const type = document.getElementById('regType').value;
    const dc = document.getElementById('regDC').value;
    let id = document.getElementById('regId').value.trim();
    if(!id){
      const nums = S.assets.map(a=>{ const m=a.id.match(/RT-(\d+)/); return m?parseInt(m[1],10):0; });

    }
    if(findAsset(id)){ showToast('Barcode already registered.', true); return; }
    S.assets.push({ id, type, homeDC:dc, status:'Available at DC', stage:0, outstanding:null, manifestId:null, manifestKind:null, hubArrivalAt:null, custodyLog:[], registeredAt: nowTs() });
    S.taggedFleet = Math.min(S.totalFleet, S.taggedFleet + 1);
    saveState(); showToast('Registered ' + id);
    render();
  });
  document.getElementById('regCamBtn').addEventListener('click', ()=>{
    openScanner((text)=>{ document.getElementById('regId').value = text; showToast('Scanned: ' + text); });
  });

  document.getElementById('dcSiteList').innerHTML = siteListRowsHtml('dc', S.dcSites);
  document.getElementById('hubSiteList').innerHTML = siteListRowsHtml('hub', S.hubSites);
  document.getElementById('returnsSiteList').innerHTML = siteListRowsHtml('returns', S.returnsFacilities);
  document.getElementById('addDCBtn').addEventListener('click', ()=>{
    const input = document.getElementById('newDCInput');
    const res = addSite('dc', input.value);
    if(!res.ok){ showToast(res.msg, true); return; }

  document.getElementById('addHubBtn').addEventListener('click', ()=>{
    const input = document.getElementById('newHubInput');
    const res = addSite('hub', input.value);
    if(!res.ok){ showToast(res.msg, true); return; }
    input.value = ''; showToast('Hub added.'); render();
  });
  document.getElementById('addReturnsBtn').addEventListener('click', ()=>{
    const input = document.getElementById('newReturnsInput');
    const res = addSite('returns', input.value);
    if(!res.ok){ showToast(res.msg, true); return; }
    input.value = ''; showToast('Returns facility added.'); render();

  document.querySelectorAll('[data-remove-site]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const res = removeSite(btn.dataset.removeSite, btn.dataset.siteName);
      if(!res.ok){ showToast(res.msg, true); return; }

  drawRegistryTable();

function drawRegistryTable(){

      <td style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim);">${fmtTs(a.registeredAt)}</td>

/* ---------------------------------------------------------------------

function openAssetDetail(assetId){
  const asset = findAsset(assetId);
  if(!asset) return;
  const info = asset.outstanding ? { label:'Outstanding', cls:'c-outstanding' } : { label:asset.status, cls:statusChipClass(asset.status) };
  const box = document.getElementById('assetModalBox');
  let html = `<button type="button" class="mb-close" id="assetModalClose">×</button>
    <h2>${escapeHtml(asset.id)}</h2>
    <div class="mb-sub">${asset.type} · registered ${fmtTs(asset.registeredAt)}</div>
    <div style="margin-bottom:14px;"><span class="chip ${info.cls}"><span class="dot"></span>${escapeHtml(info.label)}</span></div>
    <div class="detail-grid">
      <div class="detail-item"><div class="k">Home site</div><div class="v">${escapeHtml(asset.homeDC)}</div></div>
      ${asset.manifestId ? `<div class="detail-item"><div class="k">Active manifest</div><div class="v">${escapeHtml(asset.manifestId)}</div></div>` : ''}
      ${asset.hubArrivalAt ? `<div class="detail-item"><div class="k">Hub arrival</div><div class="v">${fmtTs(asset.hubArrivalAt)}</div></div>` : ''}
      ${asset.outstanding ? `<div class="detail-item"><div class="k">Outstanding reason</div><div class="v">${escapeHtml(asset.outstanding.reason)}</div></div>
        <div class="detail-item"><div class="k">Outstanding since</div><div class="v">${fmtTs(asset.outstanding.since)} (${daysSince(asset.outstanding.since)}d)</div></div>` : ''}
    </div>
    <h3 style="margin-top:0;">Scan history</h3>
    <div class="timeline">`;
  if(!asset.custodyLog || asset.custodyLog.length===0){
    html += `<div class="empty-note">No scan events logged yet.</div>`;
  } else {
    asset.custodyLog.slice().reverse().forEach(ev=>{
      html += `<div class="ev">
          <div class="ts">${fmtTs(ev.ts)}</div>
          <div class="dotcol"><span></span></div>
          <div class="body">${escapeHtml(ev.note)}${ev.operator ? `<div class="op">${escapeHtml(ev.operator)}</div>` : ''}</div>
        </div>`;
    });
  }
  html += `</div>`;
  box.innerHTML = html;
  document.getElementById('assetModal').classList.add('open');
  document.getElementById('assetModalClose').addEventListener('click', closeAssetDetail);
}
function closeAssetDetail(){ document.getElementById('assetModal').classList.remove('open'); }
document.getElementById('assetModal').addEventListener('click', (e)=>{ if(e.target.id==='assetModal') closeAssetDetail(); });

/* ---------------------------------------------------------------------

   --------------------------------------------------------------------- */
function computeAvgCycleTime(){
  const completed = S.manifests.filter(m=>m.kind==='return' && m.stage===7);
  if(completed.length===0) return null;
  let totalHrs = 0, count=0;
  completed.forEach(rm=>{
    const dispatch = S.manifests.find(dm=>dm.kind==='dispatch' && dm.expected.some(id=>rm.expected.includes(id)));
    if(dispatch){ totalHrs += (rm.createdAt - dispatch.createdAt)/3600000; count++; }
  });
  return count ? Math.round(totalHrs/count) : null;
}
function renderDashboard(){
  const rollups = { Available:0, 'In Dispatch':0, 'In Transit':0, 'At Hub':0, 'At WSW':0, 'Ready for Return':0, Outstanding:0, Damaged:0, Maintenance:0, 'GLS Custody':0, 'Inter-DC Transfer':0 };
  S.assets.forEach(a=> rollups[rollupStatus(a)]++ );
  const coveragePct = Math.round(S.taggedFleet / S.totalFleet * 100);
  const avgCycle = computeAvgCycleTime();
  const lossRate = Math.round((rollups.Outstanding / Math.max(1,S.assets.length)) * 1000)/10;
  const excCount = S.exceptions.length;

  const siteCounts = {};
  [...DC_SITES, ...HUB_SITES, ...RETURNS_SITES].forEach(s=> siteCounts[s]=0 );
  S.assets.forEach(a=>{
    if(a.status.startsWith('At Hub:')) siteCounts[a.status.replace('At Hub: ','')] = (siteCounts[a.status.replace('At Hub: ','')]||0)+1;
    else siteCounts[a.homeDC] = (siteCounts[a.homeDC]||0)+1;
  });
  const sitesWithAssets = Object.keys(siteCounts).filter(s=>siteCounts[s]>0);
  const sitesWithCoords = sitesWithAssets.filter(s=>SITE_COORDS[s]);
  const sitesUnmapped = sitesWithAssets.filter(s=>!SITE_COORDS[s]);

  let html = `<div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;">
      <div><h2>Real-Time Dashboard &amp; Asset Status Monitoring</h2><div class="desc" style="margin-bottom:0;">Accessible to DC managers and hub supervisors.</div></div>
      <div class="refresh-note"><span class="pulse"></span> Auto-refreshing every 60s · last updated <span id="lastUpdated">${new Date().toLocaleTimeString()}</span></div>
    </div>

    <h3>Status <span style="font-family:var(--font-mono);font-size:9.5px;color:var(--text-dimmer);text-transform:none;letter-spacing:0;">— click to filter the table below</span></h3>
    <div class="status-grid" id="statusGrid">
      ${Object.entries(rollups).map(([k,v])=>`<button type="button" class="status-cell" data-status="${escapeHtml(k)}"><div class="sv">${v}</div><div class="sl">${k}</div></button>`).join('')}
    </div>

    <h3>KPI tracking</h3>
    <div class="kpi-grid">
      <div class="kpi"><div class="kv">${coveragePct}%</div><div class="kl">Tagging coverage</div></div>
      <div class="kpi"><div class="kv">${avgCycle!==null ? avgCycle+'h' : '—'}</div><div class="kl">Avg. asset cycle time</div></div>
      <div class="kpi"><div class="kv">${lossRate}%</div><div class="kl">Loss / outstanding rate</div></div>
      <div class="kpi"><div class="kv">${excCount}</div><div class="kl">Exception count</div></div>
    </div>

    <h3>Filter</h3>
    <div class="filters">
      <select id="dashType"><option value="">All asset types</option>${ASSET_TYPES.map(t=>`<option value="${t}">${t}</option>`).join('')}</select>
      <select id="dashStatus"><option value="">All statuses</option>${Object.keys(rollups).map(k=>`<option value="${k}">${k}</option>`).join('')}</select>
      <input id="dashSearch" type="search" placeholder="Search barcode…" />
      <button class="btn sm" id="dashClear">Clear</button>
    </div>
    <div style="overflow-x:auto;">
      <table class="reg"><thead><tr><th>Barcode</th><th>Type</th><th>Status</th><th>Location</th><th>Age (days since last scan)</th></tr></thead>
        <tbody id="dashTableBody"></tbody>
      </table>
    </div>
  </div>`;

  html += `<div class="panel">
    <h3 style="margin-top:0;">Map view — asset distribution</h3>
    <div class="desc" style="margin-top:-8px;">Real map (OpenStreetMap) — plotting the ${sitesWithCoords.length} active site${sitesWithCoords.length===1?'':'s'} we have coordinates for.${sitesUnmapped.length ? ' ' + sitesUnmapped.length + ' active site(s) have no known location yet: ' + sitesUnmapped.slice(0,4).map(escapeHtml).join(', ') + (sitesUnmapped.length>4?'…':'') + '.' : ''}</div>
    <div class="map-wrap">
      <div id="leafletMap"></div>
      <div class="map-legend"><span><i style="background:var(--amber);"></i> Distribution Centres</span><span><i style="background:var(--violet);"></i> Hubs / vendor sites</span><span><i style="background:var(--green);"></i> Returns facilities</span></div>
    </div>

    <h3>Export reports</h3>
    <div class="export-row">
      <button class="btn sm" id="expStatus">Daily status snapshot (CSV)</button>
      <button class="btn sm" id="expExceptions">Exception log (CSV)</button>
      <button class="btn sm" id="expAging">Aging report (CSV)</button>
    </div>

    <h3>Exception feed</h3>
    <div id="exceptionFeed">
      ${S.exceptions.length===0 ? '<div class="empty-note">No exceptions logged.</div>' : S.exceptions.slice().reverse().slice(0,12).map(e=>`
        <div class="exception-row">
          <div class="ex-ts">${fmtTs(e.ts)}</div>
          <div><div class="ex-type">${e.type}</div><div>${escapeHtml(e.assetId)} — ${escapeHtml(e.note)}</div></div>
          <div></div>
        </div>`).join('') }
    </div>
  </div>`;

  html += `<div class="panel">
    <h3 style="margin-top:0;">Process reference — the 7 touch points</h3>
    <div class="desc">Scanning itself happens in the TFS Logistics Scan app on each operator's phone or handheld — this is the reference copy for training and audit.</div>
    <table class="ref"><thead><tr><th>#</th><th>Touch Point</th><th>Location</th><th>What happens</th></tr></thead><tbody>
      ${TP_META.map(tp=>`<tr><td>${tp.seq}</td><td>${tp.title}</td><td>${tp.location}</td><td>${tp.what}</td></tr>`).join('')}
    </tbody></table>
    <h3>Wrong Source Warehouse (WSW)</h3>
    <div class="desc">Misrouted stock — assets dispatched to the wrong DC are received, sorted, and processed back into normal outbound flow.</div>
    <table class="ref"><thead><tr><th>#</th><th>Touch Point</th><th>Location</th><th>What happens</th></tr></thead><tbody>
      ${WSW_META.map(tp=>`<tr><td>${tp.seq}</td><td>${tp.title}</td><td>${tp.location}</td><td>${tp.what}</td></tr>`).join('')}
    </tbody></table>
    <h3>Non-linear operational flows</h3>
    <div class="desc">Lifecycle events that occur outside the standard DC-to-hub-to-DC dispatch loop.</div>
    <table class="ref"><thead><tr><th>Flow</th><th>Role</th><th>What happens</th></tr></thead><tbody>
      ${NONLINEAR_META.map(nl=>`<tr><td>${nl.title}</td><td>${nl.role}</td><td>${nl.what}</td></tr>`).join('')}
    </tbody></table>
  </div>`;

  return html;
}
function bindDashboard(){
  drawDashboardTable();
  renderLeafletMap();
  document.getElementById('dashType').addEventListener('change', drawDashboardTable);
  document.getElementById('dashStatus').addEventListener('change', ()=>{ drawDashboardTable(); syncStatusGridActive(); });
  document.getElementById('dashSearch').addEventListener('input', drawDashboardTable);
  document.getElementById('dashClear').addEventListener('click', ()=>{
    document.getElementById('dashType').value=''; document.getElementById('dashStatus').value=''; document.getElementById('dashSearch').value='';
    drawDashboardTable(); syncStatusGridActive();
  });
  document.getElementById('statusGrid').addEventListener('click', (e)=>{
    const cell = e.target.closest('.status-cell'); if(!cell) return;
    const statusSel = document.getElementById('dashStatus');
    statusSel.value = (statusSel.value === cell.dataset.status) ? '' : cell.dataset.status; // click again to clear

  });
  document.getElementById('expStatus').addEventListener('click', ()=> exportCsv('mercury-status-snapshot.csv',
    ['Barcode','Type','Status','Home Site','Registered'],

    ['Timestamp','Type','Asset','Note'],
    S.exceptions.map(e=>[new Date(e.ts).toISOString(), e.type, e.assetId, e.note])));
  document.getElementById('expAging').addEventListener('click', ()=> exportCsv('mercury-aging-report.csv',
    ['Barcode','Status','Days at current status'],
    S.assets.filter(a=>a.hubArrivalAt || a.outstanding).map(a=>[a.id, a.outstanding?'Outstanding':a.status, a.outstanding?daysSince(a.outstanding.since):daysSince(a.hubArrivalAt)])));

  clearInterval(window.__mercuryRefresh);
  window.__mercuryRefresh = setInterval(()=>{
    const el = document.getElementById('lastUpdated');
    if(!el){ clearInterval(window.__mercuryRefresh); return; }
    el.textContent = new Date().toLocaleTimeString();
    if(activeTab==='dashboard') drawDashboardTable();
  }, 60000);
}
function syncStatusGridActive(){
  const current = document.getElementById('dashStatus').value;
  document.querySelectorAll('#statusGrid .status-cell').forEach(cell=>{
    cell.classList.toggle('active', cell.dataset.status === current && current !== '');
  });
}
function drawDashboardTable(){
  const type = document.getElementById('dashType').value;
  const status = document.getElementById('dashStatus').value;
  const q = document.getElementById('dashSearch').value.trim().toLowerCase();
  let rows = S.assets.filter(a=>{
    if(type && a.type!==type) return false;
    if(status && rollupStatus(a)!==status) return false;
    if(q && !a.id.toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b)=>a.id.localeCompare(b.id));
  const body = document.getElementById('dashTableBody');
  body.innerHTML = rows.map(a=>{
    const loc = a.status.startsWith('At Hub:') ? a.status.replace('At Hub: ','') : (a.manifestKind==='return' ? (findManifest(a.manifestId)||{}).originHub||'—' : a.homeDC);
    const ageBasis = a.outstanding ? a.outstanding.since : (a.hubArrivalAt || a.registeredAt);
    return `<tr data-asset-id="${escapeHtml(a.id)}">
      <td style="font-family:var(--font-mono);font-weight:600;">${a.id}</td>
      <td>${a.type}</td>
      <td><span class="chip ${a.outstanding?'c-outstanding':statusChipClass(a.status)}"><span class="dot"></span>${a.outstanding?'Outstanding':a.status}</span></td>
      <td>${loc}</td>
      <td style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim);">${daysSince(ageBasis)}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="5" class="empty-note">No matching assets.</td></tr>`;
  body.querySelectorAll('tr[data-asset-id]').forEach(tr=>{
    tr.addEventListener('click', ()=> openAssetDetail(tr.dataset.assetId));
  });
}
function exportCsv(filename, headers, rows){
  const csv = [headers.join(',')].concat(rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','))).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 500);
  showToast('Exported ' + filename);
}

/* ---------------------------------------------------------------------
   Real map (Leaflet + OpenStreetMap) — replaces the old illustrative SVG
   --------------------------------------------------------------------- */
let leafletMapInstance = null;
function renderLeafletMap(){
  const container = document.getElementById('leafletMap');
  if(!container) return;
  if(typeof L === 'undefined'){
    container.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;font-family:var(--font-mono);font-size:11px;color:var(--text-dimmer);text-align:center;padding:20px;">Map tiles need an internet connection to load (OpenStreetMap). This will render once the app is hosted online.</div>';
    return;
  }
  if(leafletMapInstance){ leafletMapInstance.remove(); leafletMapInstance = null; }
  const map = L.map('leafletMap', { scrollWheelZoom: false }).setView([-28.8, 24.7], 5); // South Africa
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  const siteCounts = {};
  [...DC_SITES, ...HUB_SITES, ...RETURNS_SITES].forEach(s=> siteCounts[s]=0 );
  S.assets.forEach(a=>{
    if(a.status.startsWith('At Hub:')) siteCounts[a.status.replace('At Hub: ','')] = (siteCounts[a.status.replace('At Hub: ','')]||0)+1;
    else siteCounts[a.homeDC] = (siteCounts[a.homeDC]||0)+1;
  });

  const colorFor = (name) => DC_SITES.includes(name) ? '#0B63CE' : RETURNS_SITES.includes(name) ? '#1E9E63' : '#6C5CE7';
  const bounds = [];
  Object.entries(siteCounts).forEach(([name, count])=>{
    if(count <= 0) return;
    const coord = SITE_COORDS[name];
    if(!coord) return;
    const r = 6 + Math.min(14, count * 2);
    const marker = L.circleMarker(coord, { radius: r, color: colorFor(name), weight: 2, fillColor: colorFor(name), fillOpacity: 0.55 }).addTo(map);
    marker.bindPopup(`<b>${escapeHtml(name)}</b><br>${count} asset${count===1?'':'s'}`);
    bounds.push(coord);
  });
  if(bounds.length){ map.fitBounds(bounds, { padding: [30,30], maxZoom: 10 }); }
  leafletMapInstance = map;
}

/* ---------------------------------------------------------------------
   Camera barcode scan (used by "Register a new asset")
   --------------------------------------------------------------------- */
let zxingReader = null;
let scanCallback = null;
function scanSupported(){ return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) && typeof ZXing !== "undefined"; }
async function openScanner(onResult){
  scanCallback = onResult;
  const overlay = document.getElementById("scanOverlay");
  const statusEl = document.getElementById("scanStatus");
  const video = document.getElementById("scanVideo");
  overlay.style.display = "flex";
  statusEl.style.color = "var(--text-dim)"; statusEl.textContent = "Requesting camera access…";
  if(!scanSupported()){ statusEl.style.color="var(--red)"; statusEl.textContent="Camera scanning isn't available in this browser."; return; }
  if(location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1"){
    statusEl.style.color="var(--red)"; statusEl.textContent="Camera access needs HTTPS."; return;
  }
  try{
    const hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.CODE_39, ZXing.BarcodeFormat.ITF, ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.QR_CODE, ZXing.BarcodeFormat.DATA_MATRIX]);
    zxingReader = new ZXing.BrowserMultiFormatReader(hints);
    const devices = await ZXing.BrowserCodeReader.listVideoInputDevices();
    const backCam = devices.find(d=>/back|rear|environment/i.test(d.label)) || devices[devices.length-1];
    statusEl.textContent = "Looking for a barcode…";
    zxingReader.decodeFromVideoDevice(backCam?backCam.deviceId:undefined, video, (result)=>{
      if(result){
        const text = result.getText();
        statusEl.style.color="var(--green)"; statusEl.textContent="Got it: " + text;
        setTimeout(()=>{ closeScanner(); if(scanCallback) scanCallback(text); }, 400);
      }
    });
  }catch(err){
    statusEl.style.color="var(--red)";
    if(err && err.name==="NotAllowedError") statusEl.textContent="Camera permission denied.";
    else if(err && err.name==="NotFoundError") statusEl.textContent="No camera found.";
    else statusEl.textContent="Couldn't start the camera.";
  }
}
function closeScanner(){
  document.getElementById("scanOverlay").style.display = "none";
  if(zxingReader){ try{ zxingReader.reset(); }catch(e){} zxingReader = null; }
  const video = document.getElementById("scanVideo");
  if(video && video.srcObject){ video.srcObject.getTracks().forEach(t=>t.stop()); video.srcObject=null; }
}
document.getElementById('scanCancel').addEventListener('click', closeScanner);
document.getElementById('scanOverlay').addEventListener('click', (e)=>{ if(e.target.id==='scanOverlay') closeScanner(); });

render();
</script>
