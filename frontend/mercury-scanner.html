<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TFS Logistics</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F4F7FB">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F7FB; --panel:#FFFFFF; --panel-2:#EEF3FA; --panel-3:#E1EAF6;
    --line:rgba(10,40,80,0.08); --line-strong:rgba(10,40,80,0.18);
    --amber:#0B63CE; --amber-dim:rgba(11,99,206,0.15);
    --cyan:#2AA8E0; --cyan-dim:rgba(42,168,224,0.15);
    --green:#1E9E63; --green-dim:rgba(30,158,99,0.15);
    --red:#D93025; --red-dim:rgba(217,48,37,0.15);
    --violet:#6C5CE7; --violet-dim:rgba(108,92,231,0.15);
    --text:#101A2B; --text-dim:#5B6B82; --text-dimmer:#93A0B2;
    --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:var(--font-body); min-height:100vh; -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:560px; margin:0 auto; padding:16px 14px 60px; }
  header.top{ display:flex; align-items:center; justify-content:space-between; padding-bottom:12px; margin-bottom:14px; border-bottom:1px solid var(--line); gap:8px; }
  .brand{ display:flex; align-items:center; gap:9px; }
  .brand .mark{ width:auto; min-width:40px; height:30px; padding:0 7px; border-radius:6px; background:linear-gradient(135deg,var(--amber),var(--cyan)); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; color:#FFFFFF; font-size:11.5px; letter-spacing:0.5px; }
  .brand h1{ font-family:var(--font-display); font-size:17px; margin:0; letter-spacing:0.3px; }
  .session-tag{ display:flex; align-items:center; gap:8px; font-family:var(--font-mono); font-size:10.5px; color:var(--text-dim); }
  .session-tag b{ color:var(--text); font-weight:600; }
  .session-tag button{ font-family:var(--font-mono); font-size:10px; background:transparent; border:1px solid var(--line-strong); color:var(--text-dim); padding:5px 8px; border-radius:6px; cursor:pointer; }

  .back-link{ display:inline-flex; align-items:center; gap:5px; font-family:var(--font-mono); font-size:11.5px; color:var(--text-dim); background:transparent; border:none; cursor:pointer; padding:0; margin-bottom:12px; }
  .back-link:hover{ color:var(--text); }

  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; }
  .panel + .panel{ margin-top:12px; }
  .panel h2{ font-family:var(--font-display); font-size:16px; margin:0 0 4px; }
  .panel .desc{ font-family:var(--font-body); font-size:12px; color:var(--text-dim); margin-bottom:12px; }

  .btn{ font-family:var(--font-display); font-size:14px; letter-spacing:0.2px; border-radius:9px; border:1px solid var(--line-strong); background:var(--panel-2); color:var(--text); padding:13px 16px; cursor:pointer; }
  .btn:hover{ border-color:var(--text-dim); }
  .btn:disabled{ opacity:0.35; cursor:not-allowed; }
  .btn.primary{ background:var(--amber); color:#FFFFFF; border-color:var(--amber); font-weight:600; }
  .btn.primary:hover{ filter:brightness(1.08); }
  .btn.danger{ background:transparent; border-color:var(--red); color:var(--red); }
  .btn.sm{ padding:7px 11px; font-size:12px; }
  .btn.block{ width:100%; }
  input, select{ font-family:var(--font-body); font-size:15px; padding:12px 13px; border-radius:9px; border:1px solid var(--line-strong); background:var(--panel-2); color:var(--text); }
  input:focus, select:focus{ outline:none; border-color:var(--cyan); }

  .chip{ display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:10.5px; letter-spacing:0.6px; text-transform:uppercase; padding:5px 10px; border-radius:20px; border:1px solid transparent; white-space:nowrap; }
  .chip .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }
  .chip.c-active{ background:var(--amber-dim); color:var(--amber); border-color:rgba(11,99,206,0.4); }

  .login-wrap{ margin:30px auto 0; }
  .login-wrap .panel{ text-align:left; }
  .role-grid{ display:grid; grid-template-columns:1fr; gap:9px; margin-bottom:14px; }
  .role-card{ background:var(--panel-2); border:1px solid var(--line-strong); border-radius:10px; padding:14px; text-align:left; cursor:pointer; }
  .role-card:hover{ border-color:var(--cyan); }
  .role-card.selected{ border-color:var(--amber); background:var(--amber-dim); }
  .role-card .r-title{ font-family:var(--font-display); font-size:15px; }
  .role-card .r-sub{ font-family:var(--font-mono); font-size:10px; color:var(--text-dim); margin-top:3px; text-transform:uppercase; letter-spacing:0.5px; }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-family:var(--font-mono); font-size:10px; letter-spacing:0.8px; text-transform:uppercase; color:var(--text-dim); margin-bottom:5px; }
  .field select, .field input{ width:100%; }

  /* Touch point picker — big tap targets, only the operator's own steps */
  .tp-list{ display:flex; flex-direction:column; gap:10px; }
  .tp-card{ background:var(--panel-2); border:1px solid var(--line-strong); border-radius:10px; padding:16px; cursor:pointer; text-align:left; color:var(--text); display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .tp-card:hover{ border-color:var(--cyan); }
  .tp-card .tp-num{ font-family:var(--font-mono); font-size:10.5px; color:var(--amber); letter-spacing:1px; }
  .tp-card .tp-title{ font-family:var(--font-display); font-size:16px; margin:3px 0 1px; }
  .tp-card .tp-loc{ font-family:var(--font-mono); font-size:10.5px; color:var(--text-dim); }
  .tp-card .arrow{ font-family:var(--font-mono); color:var(--text-dimmer); font-size:18px; }
  .tp-card.other{ border-style:dashed; border-color:var(--violet); }
  .tp-card.other .tp-num{ color:var(--violet); }
  .tp-pick-list{ display:flex; flex-direction:column; gap:8px; }
  .tp-pick{ background:var(--panel-2); border:1px solid var(--line-strong); border-radius:10px; padding:13px 14px; cursor:pointer; text-align:left; color:var(--text); }
  .tp-pick:hover{ border-color:var(--cyan); }
  .tp-pick .pk-id{ font-family:var(--font-mono); font-size:13px; font-weight:600; }
  .tp-pick .pk-sub{ font-family:var(--font-mono); font-size:10.5px; color:var(--text-dim); margin-top:2px; }

  .manifest-box{ background:var(--panel-2); border:1px solid var(--line-strong); border-radius:10px; padding:14px 15px; }
  .manifest-box .mb-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:8px; }
  .manifest-box .mb-id{ font-family:var(--font-mono); font-size:13px; font-weight:600; }
  .progress-row{ display:flex; align-items:center; gap:10px; margin:10px 0; }
  .progress-bar{ flex:1; height:9px; background:var(--panel-3); border-radius:5px; overflow:hidden; }
  .progress-bar .fill{ height:100%; background:linear-gradient(90deg,var(--amber),var(--green)); border-radius:5px; }
  .progress-label{ font-family:var(--font-mono); font-size:11.5px; color:var(--text-dim); white-space:nowrap; }

  .scan-row{ display:flex; gap:8px; margin:10px 0; }
  .scan-row input{ flex:1; font-family:var(--font-mono); font-size:16px; }
  .scan-row .btn{ white-space:nowrap; }

  .asset-pill-grid{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .apill{ font-family:var(--font-mono); font-size:11px; padding:6px 10px; border-radius:7px; border:1px solid var(--line-strong); background:var(--panel); }
  .apill.scanned{ border-color:var(--green); color:var(--green); }
  .apill.pending{ border-color:var(--line-strong); color:var(--text-dim); }
  .apill.unexpected{ border-color:var(--red); color:var(--red); }
  .apill.priority{ border-color:var(--amber); color:var(--amber); }

  .alert{ font-family:var(--font-mono); font-size:12px; padding:10px 12px; border-radius:8px; margin-top:10px; }
  .alert.warn{ background:var(--red-dim); color:var(--red); border:1px solid rgba(217,48,37,0.35); }
  .alert.info{ background:var(--cyan-dim); color:var(--cyan); border:1px solid rgba(42,168,224,0.35); }
  .alert.ok{ background:var(--green-dim); color:var(--green); border:1px solid rgba(30,158,99,0.35); }

  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--panel-2); border:1px solid var(--green); color:var(--green); font-family:var(--font-mono); font-size:12px; padding:10px 18px; border-radius:8px; z-index:999; box-shadow:0 10px 26px rgba(0,0,0,0.4); opacity:0; pointer-events:none; transition:opacity .2s,transform .2s; max-width:90%; text-align:center; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }
  .toast.err{ border-color:var(--red); color:var(--red); }
  footer{ text-align:center; margin-top:26px; font-family:var(--font-mono); font-size:9px; letter-spacing:1px; color:var(--text-dimmer); }
  .hidden{ display:none !important; }
  .empty-note{ font-family:var(--font-mono); font-size:12px; color:var(--text-dimmer); padding:8px 0; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<div id="scanOverlay" style="position:fixed;inset:0;background:rgba(6,10,18,0.94);z-index:1000;display:none;align-items:center;justify-content:center;padding:16px;">
  <div style="background:var(--panel);border:1px solid var(--line-strong);border-radius:12px;width:100%;max-width:420px;padding:16px;">
    <h3 style="font-family:var(--font-display);font-size:17px;margin:0 0 4px;">Scan barcode</h3>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim);margin-bottom:10px;">Point the camera at the asset barcode.</div>
    <div style="position:relative;width:100%;aspect-ratio:4/3;background:#000;border-radius:8px;overflow:hidden;border:1px solid var(--line-strong);">
      <video id="scanVideo" muted playsinline style="width:100%;height:100%;object-fit:cover;display:block;"></video>
    </div>
    <div id="scanStatus" style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim);margin-top:10px;min-height:16px;"></div>
    <div style="display:flex;justify-content:flex-end;margin-top:10px;"><button class="btn sm" id="scanCancel">Cancel</button></div>
  </div>
</div>

function nowTs(){ return Date.now(); }
function fmtTs(ts){ return ts ? new Date(ts).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '—'; }
function daysSince(ts){ return Math.floor((nowTs()-ts)/86400000); }
function escapeHtml(str){ return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function uidManifest(prefix){ return prefix + '-' + String(Math.floor(100000+Math.random()*899999)); }

/* =========================================================
   API client — every read/write in this app goes through the real
   backend now. See TECHNICAL-SPEC.md §7 for the original mapping this
   retrofit implements.
   ========================================================= */
const API_BASE_URL = window.TFS_API_BASE_URL || 'http://localhost:4000';
let apiToken = sessionStorage.getItem('tfs_token') || null;

async function apiRequest(method, path, body){
  const headers = { 'Content-Type': 'application/json' };
  if(apiToken) headers.Authorization = 'Bearer ' + apiToken;
  const res = await fetch(API_BASE_URL + path, { method, headers, body: body!==undefined ? JSON.stringify(body) : undefined });
  let data = null;
  try{ data = await res.json(); }catch(e){ /* e.g. 204 */ }
  if(!res.ok){ throw new Error((data && data.error) || ('request failed: ' + res.status)); }
  return data;
}
const apiGet = (path) => apiRequest('GET', path);
const apiPost = (path, body) => apiRequest('POST', path, body);

/* Backend rows use snake_case DB column names; every existing render()
   function below expects the original camelCase shape, so we translate
   once here rather than touching 900 lines of template literals. */
function mapAssetFromApi(a){
  return {
    id:a.id, type:a.type, homeDC:a.home_site_code, status:a.status, stage:a.stage,
    outstanding: a.outstanding_reason ? { reason:a.outstanding_reason, since: a.outstanding_since ? new Date(a.outstanding_since).getTime() : nowTs() } : null,
    manifestId:a.manifest_id, manifestKind:a.manifest_kind,
    hubArrivalAt: a.hub_arrival_at ? new Date(a.hub_arrival_at).getTime() : null,
    custodyLog: (a.custodyLog||[]).map(c=>({note:c.note, ts:new Date(c.ts).getTime(), operator:c.operator})),
    transferTo: a.transfer_to_code,
    registeredAt: a.registered_at ? new Date(a.registered_at).getTime() : nowTs(),
  };
}
function mapManifestFromApi(m){
  const assets = m.assets || [];
  return {
    id:m.id, kind:m.kind, originDC:m.origin_dc_code, destinationHub:m.destination_hub_code,
    originHub:m.origin_hub_code, destinationDC:m.destination_dc_code,
    createdAt: m.created_at ? new Date(m.created_at).getTime() : nowTs(),
    expected: assets.filter(a=>a.expected).map(a=>a.asset_id),
    scanned: {}, unexpected: [],
    stage:m.stage, log:[], completedDispatch: !!m.completed_dispatch, returnManifestId:null,
    ePOD:m.epod_id, eta:m.eta,
  };
}
/** Refetches assets + manifests from the backend into the local mirror `S` reads for rendering. Call after every successful write. */
async function syncStateFromApi(){
  const [assets, manifests] = await Promise.all([apiGet('/api/assets'), apiGet('/api/manifests')]);
  S.assets = assets.map(mapAssetFromApi);
  S.manifests = manifests.map(mapManifestFromApi);
}

function seedSiteCatalog(){
  // Site *catalogs* (which DCs/hubs/returns facilities exist, for dropdown
  // population) still ship with the client as static reference data —
  // the backend has no public unauthenticated "list sites" endpoint (by
  // design: /api/sites requires a token, and you need a site to log in).
  // The backend independently validates every real action against its
  // own sites table, so this is safe: a stale/incorrect entry here just
  // means a dropdown option that the server will reject, never a way to
  // bypass server-side validation.
  return { assets:[], manifests:[], exceptions:[], taggedFleet:0, totalFleet:0, session:null,
    dcSites: DC_SITES.slice(), hubSites: HUB_SITES.slice(), returnsFacilities: RETURNS_SITES.slice() };
}

function findManifest(id){ return S.manifests.find(m=>m.id===id); }
function showToast(msg, isErr){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show' + (isErr?' err':'');
  setTimeout(()=> t.className='toast', 1900);
}

function bindLogin(){
  let selectedRole = null;
  document.querySelectorAll('.role-card').forEach(card=>{
    card.addEventListener('click', ()=>{
      document.querySelectorAll('.role-card').forEach(c=>c.classList.remove('selected'));
      card.classList.add('selected');
      selectedRole = card.dataset.role;
      const roleDef = ROLES.find(r=>r.id===selectedRole);
      const siteField = document.getElementById('siteField');
      if(roleDef.sites){
        siteField.classList.remove('hidden');
        document.getElementById('siteLabel').textContent = roleDef.id === 'DC' ? 'Distribution Centre' : roleDef.id === 'WSW' ? 'Distribution Centre (WSW site)' : 'Hub / vendor site';
        document.getElementById('siteSelect').innerHTML = roleDef.sites.map(s=>`<option value="${s}">${s}</option>`).join('');
      } else {
        siteField.classList.add('hidden');
      }
    });
  });
  document.getElementById('loginBtn').addEventListener('click', async ()=>{
    if(!selectedRole){ showToast('Select a role first.', true); return; }
    const roleDef = ROLES.find(r=>r.id===selectedRole);
    const opName = document.getElementById('opName').value.trim() || 'Unnamed operator';
    const site = roleDef.sites ? document.getElementById('siteSelect').value : null;
    const btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.textContent = 'Logging in…';
    try{
      const data = await apiPost('/api/auth/login', { operatorName: opName, role: selectedRole, siteCode: site });
      apiToken = data.token;
      sessionStorage.setItem('tfs_token', apiToken);
      S.session = { role: selectedRole, site: site || 'TDT Fleet', opName, since: nowTs() };
      await syncStateFromApi();
      activeTP = null;
      render();
    }catch(err){
      showToast('Login failed: ' + err.message, true);
      btn.disabled = false; btn.textContent = 'Log in';
    }
  });
}

/* ---- shared scan-row UI ---- */
function scanRowHtml(inputId, camId){
  return `<div class="scan-row"><input id="${inputId}" type="text" placeholder="Scan or type barcode…" autocomplete="off" autofocus />
    <button class="btn" id="${camId}">⌗ Camera</button></div>`;
}
function bindScanRow(inputId, camId, onSubmit){
  const input = document.getElementById(inputId);
  input.focus();
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ onSubmit(input.value); input.value=''; } });
  document.getElementById(camId).addEventListener('click', ()=> openScanner((text)=>{ onSubmit(text); }));
}
/* Fill-only variant: scanning (Enter or camera) just populates the field —
   used where a second field (reason/destination) still needs to be set
   before the operator taps a separate confirm button. */
function bindScanFillOnly(inputId, camId){
  const input = document.getElementById(inputId);
  input.focus();
  document.getElementById(camId).addEventListener('click', ()=> openScanner((text)=>{ input.value = text; }));
}

/* ---- TP1: DC Dispatch Open — simplified: scan-as-you-go, no upfront checklist ---- */
function renderTP1(){
  const buf = scanBuffer.tp1 = scanBuffer.tp1 || { scanned:[] };
  const scannedCount = buf.scanned.length;
  return `<h2>TP1 — Dispatch Open</h2>
    <div class="desc">Scan each asset as you load it for dispatch. Nothing to set up first — just scan.</div>
    ${scanRowHtml('tp1Input','tp1Cam')}
    <div class="asset-pill-grid">${buf.scanned.map(id=>`<span class="apill scanned">${id}</span>`).join('') || '<span class="empty-note">No scans yet.</span>'}</div>
    <div style="margin-top:14px;display:flex;gap:8px;">
      <button class="btn primary" id="tp1Open" ${scannedCount?'':'disabled'}>Open dispatch (${scannedCount})</button>
    </div>`;
}
function bindTP1(){
  const buf = scanBuffer.tp1;
  bindScanRow('tp1Input','tp1Cam', (raw)=>{
    const id = raw.trim(); if(!id) return;
    const asset = findAsset(id);
    if(!asset){ showToast('Unknown barcode.', true); return; }
    if(asset.homeDC !== S.session.site || asset.status !== 'Available at DC'){ showToast('Not available at this DC.', true); return; }

    buf.scanned.push(id);
    refreshTPPanel();
  });
  const openBtn = document.getElementById('tp1Open');
  if(openBtn) openBtn.addEventListener('click', async ()=>{
    openBtn.disabled = true;
    try{
      const result = await apiPost('/api/touchpoints/tp1-open', { siteCode: S.session.site, assetIds: buf.scanned.slice() });
      showToast('Dispatch opened: ' + result.manifestId);
      scanBuffer.tp1 = null;
      await syncStateFromApi();
      activeTP = null; render();
    }catch(err){
      showToast(err.message, true);
      openBtn.disabled = false;
    }
  });
}

/* ---------------------------------------------------------------------
   Camera barcode scan
   --------------------------------------------------------------------- */
let zxingReader = null;
let scanCallback = null;
function scanSupported(){ return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) && typeof ZXing !== "undefined"; }
async function openScanner(onResult){
  scanCallback = onResult;
  const overlay = document.getElementById("scanOverlay");
  const statusEl = document.getElementById("scanStatus");
  const video = document.getElementById("scanVideo");
  overlay.style.display = "flex";
  statusEl.style.color = "var(--text-dim)"; statusEl.textContent = "Requesting camera access…";
  if(!scanSupported()){ statusEl.style.color="var(--red)"; statusEl.textContent="Camera scanning isn't available in this browser."; return; }
  if(location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1"){
    statusEl.style.color="var(--red)"; statusEl.textContent="Camera access needs HTTPS."; return;
  }
  try{
    const hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.CODE_39, ZXing.BarcodeFormat.ITF, ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.QR_CODE, ZXing.BarcodeFormat.DATA_MATRIX]);
    zxingReader = new ZXing.BrowserMultiFormatReader(hints);
    const devices = await ZXing.BrowserCodeReader.listVideoInputDevices();
    const backCam = devices.find(d=>/back|rear|environment/i.test(d.label)) || devices[devices.length-1];
    statusEl.textContent = "Looking for a barcode…";
    zxingReader.decodeFromVideoDevice(backCam?backCam.deviceId:undefined, video, (result)=>{
      if(result){
        const text = result.getText();
        statusEl.style.color="var(--green)"; statusEl.textContent="Got it: " + text;
        setTimeout(()=>{ closeScanner(); if(scanCallback) scanCallback(text); }, 350);
      }
    });
  }catch(err){
    statusEl.style.color="var(--red)";
    if(err && err.name==="NotAllowedError") statusEl.textContent="Camera permission denied.";
    else if(err && err.name==="NotFoundError") statusEl.textContent="No camera found.";
    else statusEl.textContent="Couldn't start the camera.";
  }
}
function closeScanner(){
  document.getElementById("scanOverlay").style.display = "none";
  if(zxingReader){ try{ zxingReader.reset(); }catch(e){} zxingReader = null; }
  const video = document.getElementById("scanVideo");
  if(video && video.srcObject){ video.srcObject.getTracks().forEach(t=>t.stop()); video.srcObject=null; }
}
document.getElementById('scanCancel').addEventListener('click', closeScanner);
document.getElementById('scanOverlay').addEventListener('click', (e)=>{ if(e.target.id==='scanOverlay') closeScanner(); });

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

render();
</script>
