<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>TFS Logistics (React build)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<!--
  React 19 removed UMD/CDN-global builds (see react.dev's 2024 upgrade
  guide) — ES modules via an import map is the current recommended
  no-build-step approach. esm.sh serves npm packages pre-converted to
  native ES modules. See frontend-react/README.md for why this project
  uses this instead of a bundler.
-->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.2.5",
    "react-dom/client": "https://esm.sh/react-dom@19.2.5/client"
  }
}
</script>

<style>
  :root{
    --bg:#F4F7FB; --panel:#FFFFFF; --panel-2:#EEF3FA; --panel-3:#E1EAF6;
    --line:rgba(10,40,80,0.08); --line-strong:rgba(10,40,80,0.18);
    --amber:#0B63CE; --amber-dim:rgba(11,99,206,0.15);
    --cyan:#2AA8E0; --cyan-dim:rgba(42,168,224,0.15);
    --green:#1E9E63; --green-dim:rgba(30,158,99,0.15);
    --red:#D93025; --red-dim:rgba(217,48,37,0.15);
    --violet:#6C5CE7; --violet-dim:rgba(108,92,231,0.15);
    --text:#101A2B; --text-dim:#5B6B82; --text-dimmer:#93A0B2;
    --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:var(--font-body); min-height:100vh; -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:560px; margin:0 auto; padding:16px 14px 60px; }
  header.top{ display:flex; align-items:center; justify-content:space-between; padding-bottom:12px; margin-bottom:14px; border-bottom:1px solid var(--line); gap:8px; }
  .brand{ display:flex; align-items:center; gap:9px; }
  .brand .mark{ width:auto; min-width:40px; height:30px; padding:0 7px; border-radius:6px; background:linear-gradient(135deg,var(--amber),var(--cyan)); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; color:#FFFFFF; font-size:11.5px; letter-spacing:0.5px; }
  .brand h1{ font-family:var(--font-display); font-size:17px; margin:0; letter-spacing:0.3px; }
  .session-tag{ display:flex; align-items:center; gap:8px; font-family:var(--font-mono); font-size:10.5px; color:var(--text-dim); }
  .session-tag b{ color:var(--text); font-weight:600; }
  .session-tag button{ font-family:var(--font-mono); font-size:10px; background:transparent; border:1px solid var(--line-strong); color:var(--text-dim); padding:5px 8px; border-radius:6px; cursor:pointer; }

  .back-link{ display:inline-flex; align-items:center; gap:5px; font-family:var(--font-mono); font-size:11.5px; color:var(--text-dim); background:transparent; border:none; cursor:pointer; padding:0; margin-bottom:12px; }
  .back-link:hover{ color:var(--text); }

  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; }
  .panel + .panel{ margin-top:12px; }
  .panel h2{ font-family:var(--font-display); font-size:16px; margin:0 0 4px; }
  .panel .desc{ font-family:var(--font-body); font-size:12px; color:var(--text-dim); margin-bottom:12px; }

  .btn{ font-family:var(--font-display); font-size:14px; letter-spacing:0.2px; border-radius:9px; border:1px solid var(--line-strong); background:var(--panel-2); color:var(--text); padding:13px 16px; cursor:pointer; }
  .btn:hover{ border-color:var(--text-dim); }
  .btn:disabled{ opacity:0.35; cursor:not-allowed; }
  .btn.primary{ background:var(--amber); color:#FFFFFF; border-color:var(--amber); font-weight:600; }
  .btn.primary:hover{ filter:brightness(1.08); }
  .btn.danger{ background:transparent; border-color:var(--red); color:var(--red); }
  .btn.sm{ padding:7px 11px; font-size:12px; }
  .btn.block{ width:100%; }
  input, select{ font-family:var(--font-body); font-size:15px; padding:12px 13px; border-radius:9px; border:1px solid var(--line-strong); background:var(--panel-2); color:var(--text); }
  input:focus, select:focus{ outline:none; border-color:var(--cyan); }

  .chip{ display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:10.5px; letter-spacing:0.6px; text-transform:uppercase; padding:5px 10px; border-radius:20px; border:1px solid transparent; white-space:nowrap; }
  .chip .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }
  .chip.c-active{ background:var(--amber-dim); color:var(--amber); border-color:rgba(11,99,206,0.4); }

  .login-wrap{ margin:30px auto 0; }
  .login-wrap .panel{ text-align:left; }
  .role-grid{ display:grid; grid-template-columns:1fr; gap:9px; margin-bottom:14px; }
  .role-card{ background:var(--panel-2); border:1px solid var(--line-strong); border-radius:10px; padding:14px; text-align:left; cursor:pointer; }
  .role-card:hover{ border-color:var(--cyan); }
  .role-card.selected{ border-color:var(--amber); background:var(--amber-dim); }
  .role-card .r-title{ font-family:var(--font-display); font-size:15px; }
  .role-card .r-sub{ font-family:var(--font-mono); font-size:10px; color:var(--text-dim); margin-top:3px; text-transform:uppercase; letter-spacing:0.5px; }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-family:var(--font-mono); font-size:10px; letter-spacing:0.8px; text-transform:uppercase; color:var(--text-dim); margin-bottom:5px; }
  .field select, .field input{ width:100%; }

  /* Touch point picker — big tap targets, only the operator's own steps */
  .tp-list{ display:flex; flex-direction:column; gap:10px; }
  .tp-card{ background:var(--panel-2); border:1px solid var(--line-strong); border-radius:10px; padding:16px; cursor:pointer; text-align:left; color:var(--text); display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .tp-card:hover{ border-color:var(--cyan); }
  .tp-card .tp-num{ font-family:var(--font-mono); font-size:10.5px; color:var(--amber); letter-spacing:1px; }
  .tp-card .tp-title{ font-family:var(--font-display); font-size:16px; margin:3px 0 1px; }
  .tp-card .tp-loc{ font-family:var(--font-mono); font-size:10.5px; color:var(--text-dim); }
  .tp-card .arrow{ font-family:var(--font-mono); color:var(--text-dimmer); font-size:18px; }
  .tp-card.other{ border-style:dashed; border-color:var(--violet); }
  .tp-card.other .tp-num{ color:var(--violet); }
  .tp-pick-list{ display:flex; flex-direction:column; gap:8px; }
  .tp-pick{ background:var(--panel-2); border:1px solid var(--line-strong); border-radius:10px; padding:13px 14px; cursor:pointer; text-align:left; color:var(--text); }
  .tp-pick:hover{ border-color:var(--cyan); }
  .tp-pick .pk-id{ font-family:var(--font-mono); font-size:13px; font-weight:600; }
  .tp-pick .pk-sub{ font-family:var(--font-mono); font-size:10.5px; color:var(--text-dim); margin-top:2px; }

  .manifest-box{ background:var(--panel-2); border:1px solid var(--line-strong); border-radius:10px; padding:14px 15px; }
  .manifest-box .mb-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:8px; }
  .manifest-box .mb-id{ font-family:var(--font-mono); font-size:13px; font-weight:600; }
  .progress-row{ display:flex; align-items:center; gap:10px; margin:10px 0; }
  .progress-bar{ flex:1; height:9px; background:var(--panel-3); border-radius:5px; overflow:hidden; }
  .progress-bar .fill{ height:100%; background:linear-gradient(90deg,var(--amber),var(--green)); border-radius:5px; }
  .progress-label{ font-family:var(--font-mono); font-size:11.5px; color:var(--text-dim); white-space:nowrap; }

  .scan-row{ display:flex; gap:8px; margin:10px 0; }
  .scan-row input{ flex:1; font-family:var(--font-mono); font-size:16px; }
  .scan-row .btn{ white-space:nowrap; }

  .asset-pill-grid{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .apill{ font-family:var(--font-mono); font-size:11px; padding:6px 10px; border-radius:7px; border:1px solid var(--line-strong); background:var(--panel); }
  .apill.scanned{ border-color:var(--green); color:var(--green); }
  .apill.pending{ border-color:var(--line-strong); color:var(--text-dim); }
  .apill.unexpected{ border-color:var(--red); color:var(--red); }
  .apill.priority{ border-color:var(--amber); color:var(--amber); }

  .alert{ font-family:var(--font-mono); font-size:12px; padding:10px 12px; border-radius:8px; margin-top:10px; }
  .alert.warn{ background:var(--red-dim); color:var(--red); border:1px solid rgba(217,48,37,0.35); }
  .alert.info{ background:var(--cyan-dim); color:var(--cyan); border:1px solid rgba(42,168,224,0.35); }
  .alert.ok{ background:var(--green-dim); color:var(--green); border:1px solid rgba(30,158,99,0.35); }

  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--panel-2); border:1px solid var(--green); color:var(--green); font-family:var(--font-mono); font-size:12px; padding:10px 18px; border-radius:8px; z-index:999; box-shadow:0 10px 26px rgba(0,0,0,0.4); opacity:0; pointer-events:none; transition:opacity .2s,transform .2s; max-width:90%; text-align:center; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }
  .toast.err{ border-color:var(--red); color:var(--red); }
  footer{ text-align:center; margin-top:26px; font-family:var(--font-mono); font-size:9px; letter-spacing:1px; color:var(--text-dimmer); }
  .hidden{ display:none !important; }
  .empty-note{ font-family:var(--font-mono); font-size:12px; color:var(--text-dimmer); padding:8px 0; }
</style>

</head>
<body>
  <div class="wrap" id="root"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
